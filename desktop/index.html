<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直播录制工作台</title><style>
*{box-sizing:border-box}body{margin:0;background:#102720;color:#e7f0eb;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}aside{position:fixed;width:210px;height:100vh;background:#1b4438;padding:28px 16px}h2{font-size:19px;color:#dfbb7c}aside button{display:block;text-align:left;width:100%;margin:8px 0;background:transparent;border:0;color:#d8e7df;padding:14px;border-radius:8px}aside button.active{background:#3a5845;color:#efcb88}main{margin-left:210px;padding:36px;max-width:1500px}h1{font-size:28px;margin:0}p{color:#94b7a7;line-height:1.7}button,.link{background:#244a3d;border:1px solid #396453;border-radius:7px;color:#deece5;padding:9px 14px;cursor:pointer}button.gold{background:#ceaa69;color:#172a22;border:0}.toolbar{display:flex;gap:10px;margin:25px 0}table{min-width:700px;width:100%;border-collapse:collapse;background:#16372d;border:1px solid #355347}td,th{white-space:nowrap;text-align:left;padding:16px;border-bottom:1px solid #294c3e}th{color:#9bc3b0;font-weight:500}small{display:block;color:#89aa9b;margin-top:7px;max-width:350px;overflow:hidden;text-overflow:ellipsis}.badge{padding:5px 8px;background:#354c3d;border-radius:20px;color:#e6c38b}.tablewrap{overflow:auto}.empty{padding:70px;text-align:center;color:#91ac9f}.panel{padding:24px;background:#18392e;border:1px solid #345345;border-radius:10px}dialog{width:min(560px,90vw);background:#193b30;color:#e4eee8;border:1px solid #5a795e;border-radius:12px;padding:25px}dialog::backdrop{background:#0009}label{display:block;margin:16px 0 7px;color:#b3c9bc}input,select{width:100%;padding:11px;background:#10291f;color:#e4eee8;border:1px solid #3b604d;border-radius:6px}.row{display:flex;gap:15px}.row>div{flex:1}a{color:#dfbd7e}#error{color:#f2ac9b}.foot{margin-top:22px;font-size:12px;color:#88a594}@media(max-width:900px){aside{position:static;width:100%;height:auto}aside button{display:inline-block;width:auto}main{margin:0;padding:20px}.tablewrap{overflow:auto}}
.record-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}.record-card{background:#193b30;border:1px solid #43614c;border-radius:12px;padding:24px}.record-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.record-top h2{color:#edf3ed;margin:0;font-size:18px}.live-dot{font-size:13px}.status-live{color:#ff8585}.status-idle{color:#a4aaa7}.status-done{color:#83d7a0}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:7px}.status-live .status-dot{animation:breathe 1.8s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.45;box-shadow:0 0 0 0 #ff777700}50%{opacity:1;box-shadow:0 0 0 5px #ff777725}}@media(prefers-reduced-motion:reduce){.status-live .status-dot{animation:none}}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:25px 0}.metrics b{display:block;font-size:26px;font-weight:500;color:#eccb8e;font-variant-numeric:tabular-nums}.metrics span{display:block;color:#9db9a9;font-size:12px;margin-top:8px}.file-path{overflow-wrap:anywhere;color:#b6c9be;font-size:12px;line-height:1.7}.record-actions{display:flex;gap:10px;margin-top:20px}.pause{background:#343d39;color:#c2c8c4;border-color:#58625c}.monitor-on{background:#245ca0;color:#edf5ff;border-color:#6393cc}.monitor-on:hover{background:#2e70bb}.pause:hover{background:#444e49}button:disabled{cursor:default;opacity:.65}.remove{background:#552e2e;color:#ff9696;border-color:#995050}.record-summary{margin:0 0 22px;color:#a9c4b4}.record-note{font-size:12px}.file-table small{max-width:220px}.file-table .link{text-decoration:none;display:inline-block}.file-table th,.file-table td{padding:13px}.schedule{max-width:200px;white-space:normal}</style><aside><h2>◉ 直播录制工作台</h2><p>后台值守 · 自动归档</p><button class="active" onclick="view('anchors',this)">◎ 主播列表</button><button onclick="view('recording',this)">● 录制中</button><button onclick="view('files',this)">▤ 录制文件</button><button onclick="view('logs',this)">≡ 运行日志</button><button onclick="view('proxy',this)">▹ 视频号取流</button><button onclick="view('settings',this)">⚙ 使用说明</button></aside><main><h1 id="heading">主播列表</h1><p id="subtitle">添加直播间，开启监控。关闭此页面后，后台服务仍继续录制。</p><div class="toolbar"><button id="add-button" class="gold" onclick="document.querySelector('dialog').showModal()">＋ 添加主播</button><button onclick="refresh()">刷新状态</button><span id="count"></span></div><div id="content"></div><div class="toolbar"><button class="pause" onclick="if(confirm('停止录制并退出后台？'))action('desktop/stop')">停止录制并退出</button></div><div class="foot">本地服务 · 30 秒检查开播 · MP4 节省空间 · 30 分钟分段 · 剩余磁盘不足 1GB 时停止新任务</div></main>
<dialog><h2>添加录制任务</h2><form id="form"><label>主播 / 任务名称</label><input name="name" required placeholder="例如：我的直播间"><div class="row"><div><label>平台</label><select name="platform"><option>抖音</option><option>直播流</option><option>视频号</option></select></div><div><label>录制内容</label><select name="mode"><option value="video" ${proxyOptions.mode==='video'?'selected':''}>视频（含声音）</option><option value="audio">仅音频</option><option value="both">视频 + 独立音频</option></select></div></div><label for="quality">视频清晰度</label><select id="quality" name="quality"><option value="360">360p · 看大概，节省空间</option><option value="480">480p · 更清楚一些</option><option value="720">720p · 较清晰</option></select><div class="panel" style="margin-top:12px;padding:12px"><strong id="estimate"></strong><small>按目标码率估算，实际大小随画面、音轨和封装略有变化。竖屏以短边为准。</small></div><label>直播间 / 直播流地址</label><input name="url" type="url" required placeholder="https://live.douyin.com/直播间ID"><p>抖音第一版使用直播间链接，主页账号链接待接入。视频号请使用“视频号取流”页面，无需粘贴链接。</p><div class="row"><div><label>开始时间（可选）</label><input type="datetime-local" name="start"></div><div><label>结束时间（可选）</label><input type="datetime-local" name="end"></div></div><p>时间使用本机时区；留空表示持续监控开播。</p><p id="error"></p><div class="toolbar"><button class="gold" type="submit">添加并监控</button><button type="button" onclick="this.closest('dialog').close()">取消</button></div></form></dialog>
<script>
if(location.port!=='8769') location.replace('http://127.0.0.1:8769/');
const fileView={platform:'全部',sort:'platform'};
let recordingCatalog={};
const proxyOptions={quality:'360',mode:'video'};
let tab='anchors',state={anchors:[],files:[],logs:[]};const names={anchors:'主播列表',recording:'录制中',files:'录制文件',logs:'运行日志',settings:'使用说明',proxy:'视频号取流'};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qualityRates={360:450,480:800,720:1500};
function estimatedMB(mode,quality){return Math.round(((mode==='audio'?0:qualityRates[quality])+96+(mode==='both'?96:0))*3600/8/1000)}
function updateEstimate(){const form=document.getElementById('form');const mode=form.elements.mode.value;const q=form.elements.quality; q.disabled=mode==='audio';document.getElementById('estimate').textContent=(mode==='audio'?'仅音频':q.value+'p MP4')+' · 录制 1 小时预计约 '+estimatedMB(mode,q.value)+' MB';}
async function changeQuality(id,quality){try{await api('quality',{id,quality})}catch(e){alert(e.message)}}
async function recordSource(id){const name=prompt('给这个视频号直播起一个名称','视频号直播');if(name===null)return;try{await api('proxy/record',{id,name,quality:document.getElementById('proxy-quality').value,mode:document.getElementById('proxy-mode').value});document.querySelectorAll('aside button')[0].click()}catch(e){alert(e.message)}}
function statusHTML(s){const cls=s==='录制中'?'status-live':s==='录制完成'?'status-done':'status-idle';return '<span class="'+cls+'"><i class="status-dot" aria-hidden="true"></i>'+esc(s)+'</span>'}
function view(t,b){tab=t;document.querySelectorAll('aside button').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()}
async function api(path,body){let r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let data=await r.json();if(!r.ok)throw Error(data.error);await refresh()}
async function action(t,id){try{await api(t,{id})}catch(e){alert(e.message)}}
async function refresh(){try{let r=await fetch('/api/state');state=await r.json();try{const catalogResponse=await fetch('/files/_catalog.json');if(catalogResponse.ok)recordingCatalog=await catalogResponse.json()}catch{}draw()}catch(e){document.getElementById('content').innerHTML='<div class="panel">后台服务未连接，请运行启动脚本。</div>'}}
function draw(){document.getElementById('heading').textContent=names[tab];document.getElementById('add-button').hidden=tab!=='anchors';document.getElementById('subtitle').textContent=tab==='recording'?'查看正在运行的录制任务，录制数据每 3 秒更新。':tab==='anchors'?'管理全部主播和监控任务，设置录制内容与计划。':tab==='proxy'?'先启动代理，再打开电脑微信的直播；识别到源后才能添加录制。':'查看录制文件、运行情况与使用说明。';document.getElementById('count').textContent=state.anchors.length+' 个任务 · '+state.anchors.filter(a=>a.status==='录制中').length+' 个正在录制';let out='';
if(tab==='anchors'){let rows=state.anchors;out=rows.length?'<div class="tablewrap"><table><tr><th>平台</th><th>主播</th><th>录制模式</th><th>清晰度 / 预计存储</th><th>监控状态</th><th>操作</th></tr>'+rows.map(a=>'<tr><td><span class="badge">'+esc(a.platform)+'</span></td><td>'+esc(a.name)+'<small>'+esc(a.url)+'</small></td><td>'+({video:'视频',audio:'音频',both:'视频 + 音频'}[a.mode])+'</td><td>'+(a.mode==='audio'?'仅音频':'<select aria-label="视频清晰度" onchange="changeQuality(\''+a.id+'\',this.value)">'+['360','480','720'].map(q=>'<option value="'+q+'" '+(q===(a.quality||'360')?'selected':'')+'>'+q+'p</option>').join('')+'</select>')+'<small>约 '+estimatedMB(a.mode,a.quality||'360')+' MB / 小时</small>'+(a.status==='录制中'?'<small>修改后下次录制生效</small>':'')+'</td><td>'+statusHTML(a.status)+'</td><td><button class="'+(a.enabled?'monitor-on':'pause')+'" aria-pressed="'+String(a.enabled)+'" onclick="action(\'toggle\',\''+a.id+'\')">'+(a.enabled?'暂停监控':'开启监控')+'</button> <button class="remove" onclick="action(\'delete\',\''+a.id+'\')">移除</button></td></tr>').join('')+'</table></div>':'<div class="panel empty">'+(tab==='recording'?'当前没有录制任务':'还没有主播。点击“添加主播”开始。')+'</div>'}
if(tab==='recording'){
const rows=state.recordings||[];
const duration=n=>[Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(x=>String(x).padStart(2,'0')).join(':');
const size=n=>n>=1073741824?(n/1073741824).toFixed(2)+' GB':(n/1048576).toFixed(1)+' MB';
out=rows.length?'<p class="record-summary">'+rows.length+' 个录制任务 · 本轮累计写入 '+size(rows.reduce((n,a)=>n+a.bytes,0))+'</p><div class="record-grid">'+rows.map(a=>`<article class="record-card"><div class="record-top"><h2>${esc(a.name)}</h2><span class="live-dot status-live"><i class="status-dot" aria-hidden="true"></i>${a.enabled?'正在录制':'正在停止'}</span></div><p><span class="badge">${esc(a.platform)}</span>　${{video:'视频（含声音）',audio:'仅音频',both:'视频 + 独立音频'}[a.mode]}</p><p class="record-note">${a.mode==='audio'?'仅音频':a.quality+'p MP4'} · 预计约 ${a.estimate_mb} MB / 小时</p><div class="metrics"><div><b>${duration(a.elapsed)}</b><span>本轮运行时长 · ${esc(a.started)} 开始</span></div><div><b>${size(a.bytes)}</b><span>本轮已写入 · ${a.segments} 个文件</span></div></div><div class="file-path">当前写入文件<br>${a.current_files.length?a.current_files.map(esc).join('<br>'):'等待直播数据写入…'}</div><div class="record-actions"><button class="${a.enabled?'monitor-on':'pause'}" aria-pressed="${a.enabled}" ${a.enabled?'':'disabled'} onclick="action('toggle','${a.id}')">${a.enabled?'暂停':'正在停止…'}</button><button class="remove" onclick="action('delete','${a.id}')">移除</button><button onclick="document.querySelectorAll('aside button')[2].click()">查看录制文件</button></div><p class="record-note">停止后保留已录文件；重新录制请到主播列表开启监控。</p></article>`).join('')+'</div>':'<div class="panel empty"><h2>当前没有正在录制的任务</h2><p>已开启监控的主播会在开播后自动出现在这里。</p><button onclick="document.querySelectorAll(\'aside button\')[0].click()">管理主播</button></div>';
}
if(tab==='files'){
const media=(state.files||[]).filter(f=>/\.(mp4|mkv|m4a|mp3|wav|avi|ts|flv)$/i.test(f.name)).map(f=>{
const parts=f.name.split('/');const folder=parts[0];const anchor=state.anchors.find(a=>a.name.replace(/[^\p{L}\p{N}_\-]/gu,'_').slice(0,60)===folder);
const platform=anchor?anchor.platform:(recordingCatalog[folder]?.platform||'未标注');return {...f,platform,anchor:anchor?anchor.name:(recordingCatalog[folder]?.name||folder),date:parts.length>2?parts[1]:'',filename:parts[parts.length-1]};});
const platforms=['全部',...new Set(media.map(f=>f.platform))].sort((a,b)=>a==='全部'?-1:b==='全部'?1:a.localeCompare(b,'zh'));
let rows=media.filter(f=>fileView.platform==='全部'||f.platform===fileView.platform);
rows.sort((a,b)=>fileView.sort==='platform'?(a.platform.localeCompare(b.platform,'zh')||a.anchor.localeCompare(b.anchor,'zh')||b.name.localeCompare(a.name)):b.date.localeCompare(a.date)||b.filename.localeCompare(a.filename));
const fileSize=n=>n>=1e9?(n/1e9).toFixed(2)+' GB':(n/1e6).toFixed(1)+' MB';
out='<div class="panel"><p>保存位置：'+esc(state.folder)+'</p><div class="row"><div><label for="file-platform">来源平台</label><select id="file-platform" onchange="fileView.platform=this.value;draw()">'+platforms.map(p=>'<option '+(p===fileView.platform?'selected':'')+'>'+esc(p)+'</option>').join('')+'</select></div><div><label for="file-sort">排列方式</label><select id="file-sort" onchange="fileView.sort=this.value;draw()"><option value="platform" '+(fileView.sort==='platform'?'selected':'')+'>按平台和主播排列</option><option value="recent" '+(fileView.sort==='recent'?'selected':'')+'>最新录制在前</option></select></div></div><p>'+rows.length+' 个文件 · 合计 '+fileSize(rows.reduce((sum,f)=>sum+f.size,0))+'</p></div>';
out+=rows.length?'<div class="tablewrap" style="margin-top:18px"><table class="file-table"><tr><th>来源平台</th><th>主播 / 文件</th><th>录制时间</th><th>文件大小</th><th>操作</th></tr>'+rows.map(f=>'<tr><td><span class="badge">'+esc(f.platform)+'</span></td><td>'+esc(f.anchor)+'<small>'+esc(f.filename)+'</small></td><td>'+esc(f.date)+'<small>'+esc(f.filename.match(/^\d{2}-\d{2}-\d{2}/)?.[0].replaceAll('-',':')||'')+'</small></td><td>'+fileSize(f.size)+'</td><td><a class="link" href="'+encodeURI(f.url).replace(/"/g,'%22').replace(/#/g,'%23')+'" download="'+esc(f.filename)+'">下载</a></td></tr>').join('')+'</table></div>':'<div class="panel empty" style="margin-top:18px">暂无符合条件的录制文件。</div>';
}
if(tab==='logs')out='<div class="panel">'+(state.logs.map(l=>'<p>'+esc(l.time)+'　'+esc(l.message)+'</p>').reverse().join('')||'暂无运行日志。')+'</div>';
if(tab==='proxy'){
const p=state.proxy||{sources:[]};out=`<div class="panel"><h2>${p.running?(p.sources.length?'● 已识别候选直播源':'● 代理运行中 · 等待识别直播源'):'代理未启动'}</h2><p>本机代理：127.0.0.1:8899。需要先配置系统代理和信任本工具生成的证书，然后在电脑微信中打开视频号直播。</p><p>实验性接入：只识别允许域名下的 HLS / FLV 候选源，不保存完整请求、Cookie 或聊天内容。能否录制需通过真实直播验证。</p><div class="toolbar"><button class="gold" onclick="action('proxy/start')" ${p.running?'disabled':''}>${p.running?'代理运行中':'启动取流代理'}</button><button class="pause" onclick="action('proxy/stop')" ${p.running?'':'disabled'}>停止取流代理</button>${p.cert_ready?'<a class="link" href="/proxy-ca.pem" download>下载公开 CA 证书</a>':''}</div><div class="row"><div><label>当前网络服务</label><select id="desktop-network">${(state.desktop?.services||[]).map(n=>'<option>'+esc(n)+'</option>').join('')}</select></div></div><div class="toolbar"><button class="gold" onclick="action('desktop/configure',{service:document.getElementById('desktop-network').value})">配置视频号取流</button><button class="pause" onclick="action('desktop/restore')">恢复网络设置</button></div><p>点击配置后，在 macOS 系统弹窗中授权。配置完成后重新打开微信直播；结束时先恢复网络，再停止取流代理。</p><p>系统代理及证书是否配置尚未自动验证。发现 ${p.media_seen||0} 次媒体响应，${p.sources.length} 个候选直播源。</p><div class="row"><div><label>视频清晰度</label><select id="proxy-quality" onchange="proxyOptions.quality=this.value"><option value="360" ${proxyOptions.quality==='360'?'selected':''}>360p · 约 246 MB / 小时</option><option value="480" ${proxyOptions.quality==='480'?'selected':''}>480p · 约 403 MB / 小时</option><option value="720" ${proxyOptions.quality==='720'?'selected':''}>720p · 约 718 MB / 小时</option></select></div><div><label>录制内容</label><select id="proxy-mode" onchange="proxyOptions.mode=this.value"><option value="video" ${proxyOptions.mode==='video'?'selected':''}>视频（含声音）</option><option value="audio" ${proxyOptions.mode==='audio'?'selected':''}>仅音频（约 43 MB / 小时）</option><option value="both" ${proxyOptions.mode==='both'?'selected':''}>视频 + 独立音频（额外约 43 MB / 小时）</option></select></div></div></div>`;
out+=p.sources.length?'<div class="panel" style="margin-top:18px">'+p.sources.map(s=>`<p>${esc(s.kind)} · ${esc(s.host)} <button class="gold" onclick="recordSource('${s.id}')">添加录制</button></p>`).join('')+'</div>':'<div class="panel empty" style="margin-top:18px">等待识别直播源。配置完成后，请重新打开视频号直播。没有候选源可能是微信未走代理、证书未信任或源格式尚未支持。</div>';
}
if(tab==='settings')out='<div class="panel"><h2>后台录制说明</h2><p>FFmpeg：'+(state.ffmpeg?'已找到':'未找到，请安装并加入 PATH')+'</p><p>关闭管理页面不影响录制。关闭后台服务、电脑关机或休眠会中断录制。</p><p>抖音：已接入 StreamGet 解析，需真实直播间验证。视频号：代理取流已接入，需配置系统代理及证书后实测；账号自动监控待接入。</p><p>开播监控通常每 30 秒检查一次。断流后重新检查；恢复逻辑已通过本地测试，长时间真实录制仍需验证。</p><p>视频保存 MP4（H.264 压缩，可选 360p / 480p / 720p，默认 360p），音频保存 M4A。正在写入的文件请等录制结束后播放。</p><p>本基础版仅包含录制功能。批量导入、主播主页解析和开机自启尚未完成。</p></div>';
document.getElementById('content').innerHTML=out}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();try{await api('add',Object.fromEntries(new FormData(e.target)));document.querySelector('dialog').close();e.target.reset();updateEstimate();document.getElementById('error').textContent=''}catch(err){document.getElementById('error').textContent=err.message}};document.getElementById('form').addEventListener('change',updateEstimate);updateEstimate();refresh();setInterval(refresh,3000);
</script></html>
